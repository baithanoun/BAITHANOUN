<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="twitter:description" content="الاستعلام عن حالة تسجيل أسرتك في سجل بيت حانون، وتسجيل بيانات أسرتك مباشرة إذا لم تكن مسجلة بعد.">

  <style>
    /* ===== إعادة تعيين ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    /* ===== ✅ صورة البانر - بعرض الصفحة بالكامل ===== */
    .banner-container {
      width: 100%;
      margin: 0;
      padding: 0;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      background: #2c3e50;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      max-height: 280px;
    }

    /* ===== رسالة بديلة إذا لم تظهر الصورة ===== */
    .banner-fallback {
      width: 100%;
      padding: 40px 20px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .banner-fallback .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }

    /* ===== البطاقة الرئيسية ===== */
    .card {
      background: white;
      padding: 20px 16px 25px;
      margin: 0 10px 10px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== الشعار ===== */
    .logo {
      margin-bottom: 6px;
    }

    .logo h1 {
      color: #2c3e50;
      font-size: 30px;
      font-weight: 800;
    }

    .logo .subtitle {
      color: #7f8c8d;
      font-size: 20px;
      font-weight: 500;
      display: block;
      margin-top: -2px;
    }

    /* ===== رأس الخدمة ===== */
    .service-header {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      padding: 10px 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin: 6px 0 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 3px 15px rgba(231, 76, 60, 0.3);
      line-height: 1.6;
    }

    .service-header span {
      font-weight: 800;
      display: inline-block;
    }

    /* ===== حقل الإدخال ===== */
    .input-group {
      margin: 8px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      direction: ltr;
      font-weight: bold;
      letter-spacing: 2px;
      -webkit-appearance: none;
      background: #fafafa;
    }

    input:focus {
      border-color: #e74c3c;
      box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.2);
      background: white;
    }

    input::placeholder {
      font-weight: normal;
      letter-spacing: 0;
      color: #aaa;
      font-size: 15px;
    }

    /* ===== زر البحث ===== */
    .search-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      font-size: 18px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .search-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4);
    }

    .search-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .search-btn:disabled {
      background: #95a5a6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
      opacity: 0.7;
    }

    .search-btn .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== منطقة النتائج ===== */
    #result {
      margin-top: 14px;
      min-height: 40px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .loading {
      color: #e74c3c;
      background: #fde8e8;
      padding: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .success {
      background: #e8f8ed;
      border: 2px solid #27ae60;
      padding: 10px;
    }

    .success .status-badge {
      background: #27ae60;
      color: white;
      padding: 6px 15px;
      border-radius: 30px;
      display: inline-block;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .confirmed-badge {
      display: inline-block;
      background: #2ecc71;
      color: white;
      padding: 4px 15px;
      border-radius: 20px;
      font-size: 12px;
      margin-right: 8px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 5px;
      font-size: 13px;
      text-align: right;
    }

    .result-table td {
      padding: 7px 5px;
      border-bottom: 1px solid #eee;
      background: white;
    }

    .result-table tr:last-child td {
      border-bottom: none;
    }

    .result-table .label {
      font-weight: bold;
      color: #555;
      background: #f8f9fa;
      width: 38%;
    }

    .result-table .value {
      color: #2c3e50;
      width: 62%;
      word-break: break-word;
    }

    .search-time {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
      font-weight: normal;
    }

    .edit-hint {
      font-size: 13px;
      color: #7f6000;
      background: #fff8e1;
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 10px;
    }

    /* ===== أزرار الإجراءات ===== */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .action-buttons.hidden {
      display: none !important;
    }

    .action-buttons .btn-confirm,
    .action-buttons .btn-edit-data {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 0;
      padding: 12px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
    }

    .btn-confirm:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(39, 174, 96, 0.4);
    }

    .btn-confirm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-edit-data {
      background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
    }

    .btn-edit-data:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(230, 126, 34, 0.4);
    }

    /* ===== حالات النتائج ===== */
    .danger {
      color: #e74c3c;
      background: #fde8e8;
      border: 2px solid #e74c3c;
      padding: 15px;
    }

    .not-registered {
      color: #e67e22;
      background: #fef5e7;
      border: 2px solid #e67e22;
      padding: 15px;
    }

    /* ===== نموذج تسجيل أسرة جديدة ===== */
    .register-form {
      text-align: right;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #e6c88a;
    }

    .register-form .form-group {
      margin-bottom: 10px;
    }

    .register-form label {
      display: block;
      font-size: 13px;
      color: #856404;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .register-form input,
    .register-form select,
    .register-form textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
      font-weight: normal;
      letter-spacing: normal;
      direction: rtl;
      text-align: right;
      background: #fff;
      font-family: inherit;
    }

    .register-form input:focus,
    .register-form select:focus,
    .register-form textarea:focus {
      border-color: #e67e22;
      box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.15);
    }

    .register-form textarea {
      resize: vertical;
      min-height: 50px;
    }

    .register-form .btn-register {
      width: 100%;
      margin-top: 4px;
      padding: 13px;
      font-size: 16px;
      background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 5px 20px rgba(230, 126, 34, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .register-form .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .confirmed-message {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #28a745;
      margin-top: 12px;
      font-size: 15px;
    }

    .confirmed-message .icon {
      font-size: 28px;
      display: block;
      margin-bottom: 5px;
    }

    /* ===== التذييل ===== */
    .footer {
      margin-top: 10px;
      text-align: center;
      padding: 10px;
    }

    .footer .record-count {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    /* ===== ✅ إشعار واتساب - ثابت ولا يختفي ===== */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c3e50;
      color: white;
      padding: 18px 24px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      z-index: 9999;
      max-width: 92%;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.1);
      min-width: 280px;
    }

    .toast.success {
      background: #27ae60;
      border-color: #2ecc71;
    }

    .toast.error {
      background: #c0392b;
      border-color: #e74c3c;
    }

    .toast.info {
      background: #f39c12;
      border-color: #e67e22;
    }

    .toast .close-btn {
      position: absolute;
      top: 4px;
      left: 12px;
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.7;
      padding: 0 5px;
      transition: opacity 0.3s;
    }

    .toast .close-btn:hover {
      opacity: 1;
    }

    .toast.hidden {
      display: none !important;
    }

    .toast .toast-icon {
      font-size: 26px;
      display: block;
      margin-bottom: 4px;
    }

    .toast .toast-sub {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 4px;
      display: block;
    }

    .toast .toast-time {
      font-size: 11px;
      font-weight: normal;
      opacity: 0.7;
      margin-top: 6px;
      display: inline-block;
      background: rgba(0,0,0,0.2);
      padding: 3px 14px;
      border-radius: 20px;
    }

    /* ===== تحسينات للجوال ===== */
    @media (max-width: 480px) {
      .card {
        padding: 16px 12px 20px;
        margin: 0 6px 8px;
        border-radius: 16px;
      }

      .banner-container {
        min-height: 60px;
      }

      .banner-container img {
        max-height: 160px;
      }

      .banner-fallback {
        padding: 20px 15px;
        font-size: 16px;
      }

      .banner-fallback .icon {
        font-size: 28px;
      }

      .logo h1 {
        font-size: 17px;
      }

      .service-header {
        font-size: 13px;
        padding: 8px 10px;
      }

      input {
        font-size: 17px;
        padding: 11px;
      }

      .search-btn {
        font-size: 16px;
        padding: 11px;
      }

      .result-table {
        font-size: 12px;
      }

      .result-table td {
        padding: 5px 3px;
      }

      .action-buttons {
        flex-direction: column;
        gap: 8px;
      }

      .action-buttons .btn-confirm,
      .action-buttons .btn-edit-data {
        width: 100%;
        padding: 12px;
        font-size: 15px;
      }

      #result {
        font-size: 14px;
      }

      .toast {
        padding: 14px 18px;
        font-size: 14px;
        bottom: 12px;
        max-width: 96%;
        min-width: auto;
        border-radius: 14px;
      }

      .toast .toast-icon {
        font-size: 22px;
      }

      .toast .close-btn {
        font-size: 18px;
        top: 2px;
        left: 8px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 12px 8px 16px;
      }

      .logo h1 {
        font-size: 15px;
      }

      input {
        font-size: 16px;
        padding: 9px;
        letter-spacing: 1px;
      }

      .result-table {
        font-size: 11px;
      }

      .result-table td {
        padding: 4px 2px;
      }

      .service-header {
        font-size: 12px;
        padding: 6px 8px;
      }
    }

    @media (min-width: 768px) {
      body {
        padding: 20px;
        align-items: center;
      }

      .container {
        max-width: 600px;
      }

      .banner-container {
        border-radius: 16px 16px 0 0;
      }

      .card {
        border-radius: 0 0 20px 20px;
        margin: 0;
      }
    }

    /* ===== ✅ زر واتساب العائم - ثابت في الشاشة دائماً ===== */
    .floating-whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      left: auto;
      z-index: 9999;
      width: 60px;
      height: 60px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: whatsappPulse 2.2s infinite;
      transition: transform 0.25s;
    }

    .floating-whatsapp:hover {
      transform: scale(1.08);
    }

    .floating-whatsapp svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    @keyframes whatsappPulse {
      0% { box-shadow: 0 4px 18px rgba(37, 211, 102, 0.5), 0 0 0 0 rgba(37, 211, 102, 0.55); }
      70% { box-shadow: 0 4px 18px rgba(37, 211, 102, 0.5), 0 0 0 16px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 4px 18px rgba(37, 211, 102, 0.5), 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    @media (max-width: 480px) {
      .floating-whatsapp {
        width: 52px;
        height: 52px;
        bottom: 16px;
        right: 16px;
      }

      .floating-whatsapp svg {
        width: 27px;
        height: 27px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ===== ✅ صورة البانر - بعرض الصفحة بالكامل ===== -->
  <div class="banner-container" id="bannerContainer">
    <img
      src="https://i.imgur.com/5ME2sNa.png"
      alt="بيت حانون - الاستعلامات وخدمة الجمهور"
      loading="lazy"
      width="600"
      height="200"
      onerror="this.style.display='none'; document.getElementById('bannerFallback').style.display='flex';"
    >
    <div class="banner-fallback" id="bannerFallback" style="display:none;">
      <span class="icon">🏠</span>
      بيت حانون
      <span style="font-size:14px;font-weight:normal;opacity:0.9;display:block;margin-top:4px;">
        الاستعلامات وخدمة الجمهور
      </span>
    </div>
  </div>

  <div class="card">

    <!-- ===== الشعار ===== -->
    <div class="logo">    <h1>بيت حانون</h1>

      <span class="subtitle">سجل الأسر المسجلة</span>
    </div>

    <!-- ===== رأس الخدمة ===== -->
    <div class="service-header">
      أهلاً وسهلاً بك في <span>الاستعلامات وخدمة الجمهور</span> - بيت حانون
    </div>

    <!-- ===== حقل البحث ===== -->
    <div class="input-group">
      <label for="idInput" class="sr-only">رقم الهوية</label>
      <input
        type="text"
        id="idInput"
        maxlength="9"
        placeholder="📝 أدخل رقم الهوية (9 أرقام)"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
      >
    </div>

    <!-- ===== زر البحث ===== -->
    <button class="search-btn" id="searchBtn" onclick="checkID()">
      🔍 بحث
    </button>

    <!-- ===== مكان عرض النتيجة ===== -->
    <div id="result" role="status" aria-live="polite"></div>

  </div>

  <!-- ===== التذييل ===== -->
  <div class="footer">
    <div class="record-count" id="recordCount"></div>
  </div>
</div>

<!-- ===== ✅ إشعار واتساب - ثابت ولا يختفي ===== -->
<div id="toast" class="toast hidden" role="alert" aria-live="assertive">
  <button class="close-btn" onclick="closeToast()">✕</button>
  <span class="toast-icon" id="toastIcon">ℹ️</span>
  <span id="toastMessage">الرسالة</span>
  <span class="toast-sub" id="toastSub"></span>
  <span class="toast-time" id="toastTime"></span>
</div>

<script>
  // ============================================================
  // ⚠️ ضع رابط نشر Apps Script (API) هنا بعد النشر
  // ============================================================
  var API_URL = "https://script.google.com/macros/s/AKfycbwopen7_ZxFuoh8ZkaB_tozzk7o1TgDNfrgg7EegQAIT0MdFPhpgv95ZOTewu4THxLL/exec";

  // ============================================================
  // دوال الاتصال بالـ API (بديل google.script.run)
  // Apps Script يُحوّل كل طلب داخلياً إلى رابط "echo" مؤقت، وأحياناً
  // يفشل هذا التحويل بشكل عابر (404 أو صفحة HTML بدل JSON) — لذلك
  // نعيد المحاولة تلقائياً قبل إظهار خطأ للمستخدم.
  // ============================================================
  function fetchWithRetry_(url, options, attempts) {
    attempts = attempts || 3;
    return fetch(url, options)
      .then(function(res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.text();
      })
      .then(function(text) {
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error("استجابة غير صالحة من الخادم");
        }
      })
      .catch(function(err) {
        if (attempts > 1) {
          return new Promise(function(resolve) {
            setTimeout(resolve, 700);
          }).then(function() {
            return fetchWithRetry_(url, options, attempts - 1);
          });
        }
        throw err;
      });
  }

  function apiGet(action, params) {
    var url = API_URL + "?action=" + encodeURIComponent(action);
    for (var key in params) {
      url += "&" + encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
    }
    return fetchWithRetry_(url);
  }

  function apiPost(action, payload) {
    return fetchWithRetry_(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: action, payload: payload || {} })
    });
  }

  // ============================================================
  // المتغيرات العامة
  // ============================================================
  var currentRowIndex = null;
  var currentIdNumber = null;
  var currentSearchData = null;
  var isConfirmed = false;
  var isSearching = false;
  var sessionWhatsAppNumber = null;

  // ============================================================
  // معادلة التحقق من صحة رقم الهوية (تحقق فوري في المتصفح)
  // ============================================================
  function isValidIdChecksum(id) {
    var digits = id.split('').map(Number);
    var sum = 0;

    for (var i = 0; i < 8; i++) {
      var weight = (i % 2 === 0) ? 1 : 2;
      var value = digits[i] * weight;
      if (value >= 10) {
        value = Math.floor(value / 10) + (value % 10);
      }
      sum += value;
    }

    var computedCheck = 10 - (sum % 10);
    var actualCheck = digits[8] === 0 ? 10 : digits[8];

    return computedCheck === actualCheck;
  }

  function escapeHtml(value) {
    var div = document.createElement('div');
    div.textContent = (value === null || value === undefined) ? '' : String(value);
    return div.innerHTML;
  }

  // ============================================================
  // بناء جدول بيانات النتيجة (مستخدم لكل من الحالة المؤكدة وغير المؤكدة)
  // ============================================================
  function buildCurrentAddress_(data) {
    var parts = [data.currGov, data.currCity, data.currAddress].filter(function(v) {
      return v && v !== "-";
    });
    return parts.length ? parts.join(" - ") : "-";
  }

  function buildResultTable(data) {
    var rows = [
      ['👨‍👩‍👧‍👦 رب الأسرة', '<strong>' + escapeHtml(data.name || "-") + '</strong>'],
      ['⚤ الجنس', escapeHtml(data.sex || "-")],
      ['💍 الحالة الاجتماعية', escapeHtml(data.status || "-")],
      ['👩 اسم الزوجة', escapeHtml(data.wifeName || "-")],
      ['🆔 رقم هوية الزوجة', escapeHtml(data.wifeId || "-")],
      ['🏠 مكان السكن', escapeHtml(data.bhAz || "-")],
      ['📱 رقم الجوال', escapeHtml(data.mobile || "-")],
      ['👨‍👩‍👧‍👦 عدد الأفراد', escapeHtml(data.familyCount || "-")],
      ['📍 العنوان الحالي', escapeHtml(buildCurrentAddress_(data))]
    ];

    var html = '<table class="result-table">';
    rows.forEach(function(row) {
      html += '<tr><td class="label">' + row[0] + '</td><td class="value">' + row[1] + '</td></tr>';
    });
    html += '</table>';
    return html;
  }

  // ============================================================
  // دالة تحميل عدد السجلات
  // ============================================================
  function loadRecordCount() {
    apiGet('getRecordCount', {})
      .then(function(data) {
        var el = document.getElementById('recordCount');
        var count = data.count || 0;
        if (count > 0) {
          el.textContent = '📊 ' + count + ' أسرة مسجلة في قاعدة البيانات';
        } else {
          el.textContent = '📊 لا توجد أسر مسجلة بعد';
        }
      })
      .catch(function() {});
  }

  // ============================================================
  // ✅ دالة عرض الإشعارات (ثابتة - لا تختفي تلقائياً)
  // ============================================================
  function showToast(message, type, subMessage, icon) {
    var toast = document.getElementById('toast');
    var toastIcon = document.getElementById('toastIcon');
    var toastMessage = document.getElementById('toastMessage');
    var toastSub = document.getElementById('toastSub');
    var toastTime = document.getElementById('toastTime');

    var icons = {
      'success': '✅',
      'error': '❌',
      'info': 'ℹ️',
      'warning': '⚠️'
    };
    toastIcon.textContent = icon || icons[type] || 'ℹ️';

    toastMessage.textContent = message;
    toastSub.textContent = subMessage || '';

    var now = new Date();
    var timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                  now.getMinutes().toString().padStart(2, '0');
    toastTime.textContent = '🕐 ' + timeStr;

    toast.className = 'toast ' + type;

    toast.classList.remove('hidden');
  }

  // ============================================================
  // ✅ دالة إغلاق الإشعار
  // ============================================================
  function closeToast() {
    var toast = document.getElementById('toast');
    toast.classList.add('hidden');
  }

  // ============================================================
  // التحميل عند فتح الصفحة
  // ============================================================
  window.onload = function() {
    loadRecordCount();
    initWhatsAppNumber();
    setTimeout(function() {
      document.getElementById('idInput').focus();
    }, 500);
  };

  // ============================================================
  // ✅ اختيار رقم واتساب عشوائياً على المتصفح فوراً عند تحميل الصفحة
  // (تم التخلي عن انتظار رد السيرفر لهذا الغرض لأن رابط Apps Script exec
  // قد يستغرق عشرات الثواني أحياناً لبدء التشغيل (cold start)، وأغلب
  // الزوار يضغطون الزر قبل وصول الرد — فكان التبديل الفعلي دائماً يظهر
  // نفس الرقم الافتراضي عملياً. الاختيار العشوائي هنا فوري 50/50 بين
  // الرقمين ولا يعتمد على أي اتصال بالشبكة)
  // ============================================================
  var WHATSAPP_NUMBERS = ["970567783330", "970567702050"];

  function initWhatsAppNumber() {
    sessionWhatsAppNumber = WHATSAPP_NUMBERS[Math.random() < 0.5 ? 0 : 1];

    var floatingLink = document.getElementById('floatingWhatsAppLink');
    if (floatingLink) {
      var message = "السلام عليكم، لدي استفسار بخصوص خدمات بيت حانون";
      floatingLink.href = "https://wa.me/" + sessionWhatsAppNumber + "?text=" + encodeURIComponent(message);
    }
  }

  // ============================================================
  // دالة البحث الرئيسية
  // ============================================================
  function checkID() {
    if (isSearching) {
      return;
    }

    var id = document.getElementById('idInput').value.trim();
    var resultDiv = document.getElementById('result');
    var searchBtn = document.getElementById('searchBtn');

    if (id.length !== 9 || isNaN(id)) {
      resultDiv.className = "danger";
      resultDiv.innerHTML = "⚠️ يرجى إدخال رقم هوية صحيح مكون من 9 أرقام";
      return;
    }

    if (!isValidIdChecksum(id)) {
      resultDiv.className = "danger";
      resultDiv.innerHTML = "⚠️ رقم الهوية غير صحيح";
      return;
    }

    isSearching = true;
    searchBtn.disabled = true;
    searchBtn.innerHTML = '⏳ <span class="spinner">⟳</span> جاري البحث...';

    currentIdNumber = id;

    resultDiv.className = "loading";
    resultDiv.innerHTML = "⏳ جاري البحث في قاعدة البيانات...";

    apiGet('searchID', { idNumber: id })
      .then(function(response) {
        console.log("Response:", response);

        isSearching = false;
        searchBtn.disabled = false;
        searchBtn.innerHTML = '🔍 بحث';

        if (response.status === "مسجل") {
          var data = response.data || {};
          var time = response.searchTime || 0;
          currentRowIndex = response.rowIndex;
          currentSearchData = data;
          isConfirmed = response.isConfirmed || false;

          var html = '';
          var tableHtml = buildResultTable(data);

          if (isConfirmed) {
            html += `
              <div class="status-badge">✅ مسجل <span class="confirmed-badge">✓ مؤكد</span></div>
              ${tableHtml}
              <div class="search-time">⏱️ تم البحث في ${time} مللي ثانية</div>
              <div class="confirmed-message">
                <span class="icon">✅</span>
                هذا السجل <strong>مؤكد</strong> بالفعل<br>
                <span style="font-size: 13px; font-weight: normal; color: #28a745;">
                  تم تأكيد تسجيل هذه الأسرة مسبقاً، لا يمكن تعديل البيانات بعد التأكيد
                </span>
              </div>
            `;
          } else {
            html += `
              <div class="status-badge">✅ مسجل</div>
              ${tableHtml}
              <div class="search-time">⏱️ تم البحث في ${time} مللي ثانية</div>
              <div class="edit-hint">💡في حال البيانات غير صحيحة، يمكنك تعديل البيانات من خلال الضغط على زر "تعديل البيانات قبل التأكيد"</div>
              <div class="action-buttons">
                <button class="btn-edit-data" onclick="toggleEditForm()">
                  ✏️ تعديل البيانات
                </button>
              </div>
              <div class="action-buttons">
                <button class="btn-confirm" onclick="confirmRegistration()">
                  ✅ تأكيد التسجيل
                </button>
              </div>
            `;
          }

          resultDiv.className = "success";
          resultDiv.innerHTML = html;

        } else if (response.status === "غير مسجل") {
          var time = response.searchTime || 0;

          resultDiv.className = "not-registered";
          resultDiv.innerHTML = `
            ❌ <strong>غير مسجل</strong> في قاعدة البيانات
            <br><br>
            <span style="font-size: 14px; font-weight: normal;">
              يمكنك تسجيل بيانات أسرتك مباشرة عبر النموذج التالي:
            </span>

            <div class="register-form" id="registerForm">
              <div class="form-group">
                <label for="regName">👤 الاسم الرباعي لرب الأسرة</label>
                <input type="text" id="regName" placeholder="الاسم الرباعي" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="regMobile">📱 رقم الجوال</label>
                <input type="tel" id="regMobile" placeholder="05XXXXXXXX" inputmode="tel" maxlength="10" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="regOriginalCity">🏡 مكان السكن الأصلي</label>
                <input type="text" id="regOriginalCity" placeholder="مكان السكن قبل النزوح" autocomplete="off">
              </div>
                <div class="form-group">
                <label for="regGovernorate">🗺️ محافظة النزوح</label>
                <select id="regGovernorate">
                  <option value="" disabled selected>محافظة النزوح الحالية</option>
                  <option value="محافظة الشمال">محافظة الشمال</option>
                  <option value="محافظة غزة">محافظة غزة</option>
                  <option value="محافظة الوسطى">محافظة الوسطى</option>
                  <option value="محافظة خانيونس">محافظة خانيونس</option>
                  <option value="محافظة رفح">محافظة رفح</option>
                </select>
              </div>
              <div class="form-group">
                <label for="regShelter">🏕️ اسم مركز الإيواء / المخيم</label>
                <input type="text" id="regShelter" placeholder="اسم مركز الإيواء أو المخيم" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="regAddress">🏠 العنوان الحالي للنزوح</label>
                <input type="text" id="regAddress" placeholder="المدينة / الحي / اقرب معلم" autocomplete="off">
              </div>

              <div class="form-group">
                <label for="regNotes">📝 ملاحظات (اختياري)</label>
                <textarea id="regNotes" rows="2" placeholder="أي ملاحظات إضافية"></textarea>
              </div>
              <button class="btn-register" id="registerBtn" onclick="submitRegistration()">
                ✅ تسجيل جديد
              </button>
            </div>

            <div class="search-time" style="margin-top:10px;">⏱️ تم البحث في ${time} مللي ثانية</div>
          `;

        } else {
          resultDiv.className = "danger";
          resultDiv.innerHTML = "⚠️ " + (response.message || "حدث خطأ غير متوقع");
        }
      })
      .catch(function(error) {
        console.error("Error:", error);

        isSearching = false;
        searchBtn.disabled = false;
        searchBtn.innerHTML = '🔍 بحث';

        resultDiv.className = "danger";
        resultDiv.innerHTML = "⚠️ حدث خطأ في الاتصال: " + error.message;
      });
  }

  // ============================================================
  // ✅ تسجيل أسرة جديدة مباشرة في شيت NEW_P
  // ============================================================
  function submitRegistration() {
    var nameInput = document.getElementById('regName');
    var mobileInput = document.getElementById('regMobile');
    var originalCityInput = document.getElementById('regOriginalCity');
    var addressInput = document.getElementById('regAddress');
    var governorateInput = document.getElementById('regGovernorate');
    var shelterInput = document.getElementById('regShelter');
    var notesInput = document.getElementById('regNotes');
    var registerBtn = document.getElementById('registerBtn');

    var name = nameInput.value.trim();
    var mobile = mobileInput.value.replace(/\D/g, '');
    var originalCity = originalCityInput.value.trim();
    var address = addressInput.value.trim();
    var governorate = governorateInput.value;
    var shelter = shelterInput.value.trim();
    var notes = notesInput.value.trim();

    if (!name) {
      showToast("⚠️ يرجى إدخال الاسم الرباعي لرب الأسرة", "error", "", "⚠️");
      nameInput.focus();
      return;
    }
    if (mobile.length !== 10) {
      showToast("⚠️ رقم الجوال يجب أن يتكون من 10 أرقام", "error", "", "⚠️");
      mobileInput.focus();
      return;
    }
    if (!governorate) {
      showToast("⚠️ يرجى اختيار المحافظة", "error", "", "⚠️");
      governorateInput.focus();
      return;
    }

    registerBtn.disabled = true;
    registerBtn.innerHTML = '⏳ <span class="spinner">⟳</span> جاري الإرسال...';

    apiPost('submitNewRegistration', {
      hofId: currentIdNumber,
      hofName: name,
      hofMobile: mobile,
      hofOriginalCity: originalCity,
      hofAddress: address,
      hofGovernorate: governorate,
      hofShelter: shelter,
      hofNotes: notes
    })
      .then(function(response) {
        registerBtn.disabled = false;
        registerBtn.innerHTML = '✅ تسجيل الأسرة الآن';

        if (response.success) {
          showToast(response.message, "success", "سيتم مراجعة الطلب والتواصل معكم", "✅");

          var formDiv = document.getElementById('registerForm');
          if (formDiv) {
            formDiv.innerHTML = `
              <div class="confirmed-message">
                <span class="icon">✅</span>
                <strong>تم إرسال بياناتك بنجاح!</strong><br>
                <span style="font-size: 13px; font-weight: normal; color: #28a745;">
                  سيتم مراجعة الطلب والتواصل معكم قريباً
                </span>
              </div>
            `;
          }
        } else {
          showToast(response.message, "error", "يرجى المحاولة مرة أخرى", "❌");
        }
      })
      .catch(function(error) {
        registerBtn.disabled = false;
        registerBtn.innerHTML = '✅ تسجيل الأسرة الآن';
        showToast("❌ حدث خطأ: " + error.message, "error", "يرجى المحاولة مرة أخرى", "❌");
      });
  }

  // ============================================================
  // تأكيد التسجيل
  // ============================================================
  function confirmRegistration() {
    if (!confirm("سيتم تثبيت البيانات ولا يمكن التعديل بعد التثبيت")) {
      return;
    }

    if (currentRowIndex === null || currentRowIndex === undefined) {
      showToast("❌ لا يوجد سجل للتأكيد", "error", "يرجى البحث أولاً", "❌");
      return;
    }

    var confirmBtn = document.querySelector('.btn-confirm');
    confirmBtn.disabled = true;
    confirmBtn.textContent = '⏳ جاري التأكيد...';

    apiPost('confirmRegistration', { rowIndex: currentRowIndex })
      .then(function(response) {
        if (response.success) {
          showToast(response.message, "success", "تم تحديث حالة السجل", "✅");

          document.querySelectorAll('.action-buttons').forEach(function(el) {
            el.classList.add('hidden');
          });

          var resultDiv = document.getElementById('result');
          var confirmedMessage = document.createElement('div');
          confirmedMessage.className = 'confirmed-message';
          confirmedMessage.innerHTML = `
            <span class="icon">✅</span>
            <strong>تم تأكيد التسجيل بنجاح!</strong><br>
            <span style="font-size: 13px; font-weight: normal; color: #28a745;">
              تم تحديث حالة السجل إلى "مؤكد"
            </span>
          `;
          resultDiv.appendChild(confirmedMessage);

          var badge = document.querySelector('.status-badge');
          if (badge) {
            badge.innerHTML = '✅ مسجل <span class="confirmed-badge">✓ مؤكد</span>';
          }

        } else {
          showToast(response.message, "error", "يرجى المحاولة مرة أخرى", "❌");
          confirmBtn.disabled = false;
          confirmBtn.textContent = '✅ تأكيد التسجيل';
        }
      })
      .catch(function(error) {
        showToast("❌ حدث خطأ: " + error.message, "error", "يرجى المحاولة مرة أخرى", "❌");
        confirmBtn.disabled = false;
        confirmBtn.textContent = '✅ تأكيد التسجيل';
      });
  }

  // ============================================================
  // ✅ إظهار/إخفاء نموذج تعديل بيانات الأسرة (مُعبّأ مسبقاً بالبيانات الحالية)
  // ============================================================
  function toggleEditForm() {
    var confirmBtn = document.querySelector('.btn-confirm');
    var confirmRow = confirmBtn ? confirmBtn.closest('.action-buttons') : null;
    var existing = document.getElementById('editForm');
    if (existing) {
      existing.remove();
      if (confirmRow) { confirmRow.classList.remove('hidden'); }
      return;
    }

    if (confirmRow) { confirmRow.classList.add('hidden'); }

    var data = currentSearchData || {};
    var prefill = function(value) {
      return (value && value !== '-') ? escapeHtml(value) : '';
    };

    var container = document.createElement('div');
    container.className = 'register-form';
    container.id = 'editForm';
    container.innerHTML = `
      <div class="form-group">
        <label for="editName">👤 الاسم الرباعي لرب الأسرة</label>
        <input type="text" id="editName" value="${prefill(data.name)}" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editMobile">📱 رقم الجوال</label>
        <input type="tel" id="editMobile" value="${prefill(data.mobile)}" placeholder="05XXXXXXXX" inputmode="tel" maxlength="10" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editFamilyCount">👨‍👩‍👧‍👦 عدد أفراد الأسرة</label>
        <input type="tel" id="editFamilyCount" value="${prefill(data.familyCount)}" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editOriginalCity">🏡 مكان السكن الأصلي</label>
        <input type="text" id="editOriginalCity" value="${prefill(data.bhAz)}" placeholder="مكان السكن قبل النزوح" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editGovernorate">🗺️ محافظة النزوح</label>
        <select id="editGovernorate">
          <option value="" disabled selected>محافظة النزوح الحالية</option>
          <option value="محافظة الشمال">محافظة الشمال</option>
          <option value="محافظة غزة">محافظة غزة</option>
          <option value="محافظة الوسطى">محافظة الوسطى</option>
          <option value="محافظة خانيونس">محافظة خانيونس</option>
          <option value="محافظة رفح">محافظة رفح</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editShelter">🏕️ اسم مركز الإيواء / المخيم</label>
        <input type="text" id="editShelter" placeholder="اسم مركز الإيواء أو المخيم" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editAddress">🏠 العنوان الحالي للنزوح</label>
        <input type="text" id="editAddress" placeholder="المدينة / الحي / اقرب معلم" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="editNotes">📝 ملاحظات (اختياري)</label>
        <textarea id="editNotes" rows="2" placeholder="أي ملاحظات إضافية"></textarea>
      </div>
      <button class="btn-register" id="editSubmitBtn" onclick="submitAddressUpdateForm()">
        ✅ إرسال التعديل
      </button>
    `;

    var actionButtons = document.querySelector('.action-buttons');
    actionButtons.insertAdjacentElement('afterend', container);

    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ============================================================
  // ✅ إرسال طلب تعديل بيانات الأسرة إلى شيت update_address
  // ============================================================
  function submitAddressUpdateForm() {
    var nameInput = document.getElementById('editName');
    var mobileInput = document.getElementById('editMobile');
    var familyCountInput = document.getElementById('editFamilyCount');
    var originalCityInput = document.getElementById('editOriginalCity');
    var governorateInput = document.getElementById('editGovernorate');
    var shelterInput = document.getElementById('editShelter');
    var addressInput = document.getElementById('editAddress');
    var notesInput = document.getElementById('editNotes');
    var submitBtn = document.getElementById('editSubmitBtn');

    var name = nameInput.value.trim();
    var mobile = mobileInput.value.replace(/\D/g, '');
    var familyCount = familyCountInput.value.replace(/\D/g, '');
    var originalCity = originalCityInput.value.trim();
    var governorate = governorateInput.value;
    var shelter = shelterInput.value.trim();
    var address = addressInput.value.trim();
    var notes = notesInput.value.trim();

    if (!name) {
      showToast("⚠️ يرجى إدخال الاسم الرباعي لرب الأسرة", "error", "", "⚠️");
      nameInput.focus();
      return;
    }
    if (mobile.length !== 10) {
      showToast("⚠️ رقم الجوال يجب أن يتكون من 10 أرقام", "error", "", "⚠️");
      mobileInput.focus();
      return;
    }
    if (!governorate) {
      showToast("⚠️ يرجى اختيار المحافظة", "error", "", "⚠️");
      governorateInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '⏳ <span class="spinner">⟳</span> جاري الإرسال...';

    apiPost('submitAddressUpdate', {
      hofId: currentIdNumber,
      hofName: name,
      hofMobile: mobile,
      hofFamilyCount: familyCount,
      hofOriginalCity: originalCity,
      hofAddress: address,
      hofGovernorate: governorate,
      hofShelter: shelter,
      hofNotes: notes
    })
      .then(function(response) {
        if (response.success) {
          showToast(response.message, "success", "سيتم مراجعة الطلب والتواصل معكم", "✅");

          var formDiv = document.getElementById('editForm');
          if (formDiv) {
            formDiv.innerHTML = `
              <div class="confirmed-message">
                <span class="icon">✅</span>
                <strong>تم إرسال طلب التعديل بنجاح!</strong><br>
                <span style="font-size: 13px; font-weight: normal; color: #28a745;">
                  سيتم مراجعة الطلب والتواصل معكم قريباً
                </span>
              </div>
            `;
          }
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '✅ إرسال التعديل';
          showToast(response.message, "error", "يرجى المحاولة مرة أخرى", "❌");
        }
      })
      .catch(function(error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '✅ إرسال التعديل';
        showToast("❌ حدث خطأ: " + error.message, "error", "يرجى المحاولة مرة أخرى", "❌");
      });
  }

  // ============================================================
  // البحث بالضغط على Enter
  // ============================================================
  document.getElementById('idInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      checkID();
    }
  });
</script>

</body>
</html>
